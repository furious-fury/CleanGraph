[profile.default]
src = "contracts"
test = "solidity-tests"
script = "script"
out = "out"
cache_path = "cache_forge"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
